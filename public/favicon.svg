<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Dark Archival Background -->
  <rect width="512" height="512" rx="112" fill="#0C0B0A"/>
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGradient)" stroke-width="12" opacity="0.85"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Gradients & Glow -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4"/>
      <stop offset="50%" stop-color="#CFA05D"/>
      <stop offset="100%" stop-color="#8C652D"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fleur-de-lis / Royal Palace Crest -->
  <g transform="translate(256, 256) scale(1.65)" filter="url(#goldGlow)">
    <!-- Central Petal -->
    <path d="M 0 -85 C 18 -55 24 -25 22 15 C 15 5 0 0 0 0 C 0 0 -15 5 -22 15 C -24 -25 -18 -55 0 -85 Z" fill="url(#goldGradient)"/>
    <!-- Left Wing -->
    <path d="M -8 0 C -35 -35 -75 -35 -85 -10 C -92 10 -65 35 -35 30 C -15 25 -10 10 -15 0 C -25 15 -45 15 -55 5 C -60 -5 -40 -20 -15 -10 Z" fill="url(#goldGradient)"/>
    <!-- Right Wing -->
    <path d="M 8 0 C 35 -35 75 -35 85 -10 C 92 10 65 35 35 30 C 15 25 10 10 15 0 C 25 15 45 15 55 5 C 60 -5 40 -20 15 -10 Z" fill="url(#goldGradient)"/>
    <!-- Horizontal Cross Bar -->
    <path d="M -38 12 C -20 8 20 8 38 12 C 42 18 36 24 28 22 C 10 18 -10 18 -28 22 C -36 24 -42 18 -38 12 Z" fill="url(#goldGradient)"/>
    <!-- Base Stool Anchor -->
    <path d="M 0 20 C 18 20 28 35 34 60 C 20 56 0 52 0 52 C 0 52 -20 56 -34 60 C -28 35 -18 20 0 20 Z" fill="url(#goldGradient)"/>
    <!-- Bottom Pedestal -->
    <path d="M -26 62 L 26 62 L 20 70 L -20 70 Z" fill="url(#goldGradient)"/>
  </g>
</svg>
